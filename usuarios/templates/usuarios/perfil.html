<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Perfil de {{ usuario_perfil.username }} - Starlit Chapters</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-gray-100 min-h-screen">
    <div class="container mx-auto mt-10 p-6 max-w-4xl bg-slate-800 rounded-lg shadow-xl border border-slate-700">
        <div class="flex items-center gap-6">
            {% if perfil.avatar %}
                <img src="{{ perfil.avatar.url }}" class="w-28 h-28 rounded-full object-cover border-2 border-indigo-500">
            {% endif %}
            <div>
                <h2 class="text-3xl font-bold text-indigo-400">{{ usuario_perfil.username }}</h2>
                <p class="text-gray-400 mt-1">{{ perfil.bio|default:"Nenhuma biografia informada ainda." }}</p>
                {% if perfil.generos_favoritos %}
                    <span class="inline-block mt-3 bg-indigo-900/60 text-indigo-300 text-xs px-3 py-1 rounded-full border border-indigo-700">
                        {{ perfil.generos_favoritos }}
                    </span>
                {% endif %}
            </div>
        </div>

        {% if request.user == usuario_perfil %}
            <div class="mt-6 border-t border-slate-700 pt-4">
                <a href="{% url 'configuracoes' %}" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-md font-medium text-sm transition">
                    Editar Meu Perfil
                </a>
            </div>
        {% endif %}
    </div>
</body>
</html>
